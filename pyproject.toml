[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsake-backup"
version = "0.1.0"
description = "Offline content-addressed snapshots and checked restores for local folders"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
keepsake = "keepsake.cli:main"

[tool.setuptools.packages.find]
include = ["keepsake*"]
